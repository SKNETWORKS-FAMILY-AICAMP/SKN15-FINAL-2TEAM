version: '3.8'

# ========================================
# 인스턴스 1: Nginx (Entry Point)
# ========================================
# 역할: 외부 트래픽 진입점, SSL 처리, 라우팅
# 포트: 80 (HTTP), 443 (HTTPS)
# 의존성: frontend, backend 인스턴스 IP 필요

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: triplan-nginx
    volumes:
      # nginx.conf는 docker-entrypoint.sh가 생성하므로 마운트하지 않음
      - ./data/static:/static
      - ./data/media:/media
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 환경변수로 다른 인스턴스 IP 설정
      - FRONTEND_HOST=${FRONTEND_HOST:-frontend}
      - BACKEND_HOST=${BACKEND_HOST:-backend}
      - WEBSOCKET_HOST=${WEBSOCKET_HOST:-websocket}
    restart: unless-stopped
    networks:
      - triplan-network

networks:
  triplan-network:
    driver: bridge
