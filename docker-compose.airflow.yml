version: '3.8'

# ========================================
# 인스턴스 7: Airflow 통합
# ========================================
# 역할: 데이터 파이프라인 (Webserver, Scheduler, Postgres)
# 포트: 8080 (Webserver)
# 의존성: 메인 PostgreSQL 인스턴스 IP 필요 (DAG에서 사용)

services:
  # Airflow Postgres (Airflow 메타데이터용)
  airflow-postgres:
    image: postgres:15-alpine
    container_name: triplan-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
    volumes:
      - ./data/airflow-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - triplan-network

  # Airflow Webserver
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: triplan-airflow-webserver
    command: webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY}
      - AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USERNAME:-admin}
      - AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:-admin}
      # DAG에서 메인 DB 접근 시 필요
      - MAIN_DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data/airflow-data:/opt/airflow/data
    ports:
      - "8080:8080"
    depends_on:
      - airflow-postgres
    restart: unless-stopped
    networks:
      - triplan-network

  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: triplan-airflow-scheduler
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # DAG에서 메인 DB 접근 시 필요
      - MAIN_DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data/airflow-data:/opt/airflow/data
    depends_on:
      - airflow-postgres
    restart: unless-stopped
    networks:
      - triplan-network

networks:
  triplan-network:
    driver: bridge
