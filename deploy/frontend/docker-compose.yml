version: '3.8'

# Frontend EC2 인스턴스 전용 구성
# 이 파일은 Frontend EC2에서만 실행됩니다.

services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: triplan-frontend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend-ec2-ip:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://backend-ec2-ip:8001}
      - NEXT_PUBLIC_KAKAO_API_KEY=${NEXT_PUBLIC_KAKAO_API_KEY}
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - triplan-network

  nginx:
    build:
      context: ../../nginx
      dockerfile: Dockerfile
    container_name: triplan-nginx
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_data:/static
      - media_data:/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - triplan-network

networks:
  triplan-network:
    driver: bridge

volumes:
  static_data:
  media_data:
